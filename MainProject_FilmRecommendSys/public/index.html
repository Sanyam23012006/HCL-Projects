<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Film Recommendation System</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Smart movie picks</p>
          <h1>Find your next favorite film</h1>
        </div>
        <nav class="hero-nav" aria-label="Main navigation">
          <a href="/">Discover</a>
          <a href="/login">Admin sign in</a>
        </nav>
      </header>

      <main class="layout">
        <section class="panel form-panel">
          <h2>Pick your vibe</h2>
          <form id="preference-form">
            <label for="favoriteGenre">Favorite genre</label>
            <select id="favoriteGenre" name="favoriteGenre"></select>

            <label for="mood">Mood</label>
            <select id="mood" name="mood"></select>

            <label for="minimumRating">Minimum rating</label>
            <input id="minimumRating" name="minimumRating" type="number" min="5" max="10" step="0.1" value="7.5" />

            <label for="maxRuntime">Maximum runtime (minutes)</label>
            <input id="maxRuntime" name="maxRuntime" type="number" min="60" max="220" step="5" value="180" />

            <label for="includeLatest">Prefer newer movies</label>
            <input id="includeLatest" name="includeLatest" type="checkbox" />

            <button type="submit">Show recommendations</button>
          </form>
        </section>

        <section class="panel results-panel">
          <div class="results-header">
            <h2>Top picks</h2>
            <span id="statusBadge" class="status-badge">Ready</span>
          </div>
          <div id="recommendations" class="recommendation-list" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
