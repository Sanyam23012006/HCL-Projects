<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My watchlist | Film Finder</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Your saved films</p>
          <h1>My watchlist</h1>
        </div>
        <nav class="hero-nav" aria-label="Main navigation">
          <a href="/">Recommendations</a>
          <a href="/browse">Browse movies</a>
          <a href="/preferences">My preferences</a>
          <a id="watchlist-login-link" href="/user-login">User sign in</a>
          <a id="watchlist-signup-link" href="/signup">Create account</a>
          <span id="watchlist-user-welcome" class="user-welcome" hidden></span>
        </nav>
      </header>

      <main>
        <section class="panel catalog-results">
          <div class="results-header">
            <h2>Saved to your watchlist</h2>
            <span id="catalog-count" class="status-badge">Loading...</span>
          </div>
          <p class="page-intro">Your watchlist is private to your account.</p>
          <div id="library-message" class="form-message" role="status" aria-live="polite"></div>
          <div id="library-movies" class="catalog-grid"></div>
        </section>
      </main>
    </div>
    <script src="/library.js"></script>
  </body>
</html>
