<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie admin | Film Finder</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Film Finder administration</p>
          <h1>Movie library</h1>
        </div>
        <nav class="hero-nav" aria-label="Main navigation">
          <a href="/">Discover films</a>
          <button id="logout-button" class="button-link" type="button">Sign out</button>
        </nav>
      </header>

      <main class="layout">
        <section class="panel results-panel">
          <h2>CSV movie dataset</h2>
          <p class="page-intro">This dataset is currently read-only. Its 100 distinct titles and rating summaries are loaded from the CSV used by recommendations. Movie details and per-user ratings are not changed here.</p>
          <p id="movie-count" class="page-intro"></p>
          <p id="movie-message" class="form-message" role="status" aria-live="polite"></p>
          <div id="movie-list" class="movie-list" aria-live="polite"></div>
        </section>
      </main>
    </div>
    <script src="/admin.js"></script>
  </body>
</html>
