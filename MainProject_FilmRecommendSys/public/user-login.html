<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User sign in | Film Finder</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Film Finder</p>
          <h1>User sign in</h1>
        </div>
        <nav class="hero-nav" aria-label="Main navigation">
          <a href="/">Discover films</a>
          <a href="/signup">Create account</a>
          <a href="/login">Admin sign in</a>
        </nav>
      </header>

      <main class="layout">
        <section class="panel form-panel">
          <h2>Welcome back</h2>
          <p class="page-intro">Sign in to your Film Finder account.</p>
          <form id="user-auth-form" data-mode="login">
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required />
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required />
            </div>
            <p id="auth-message" class="form-message" role="status" aria-live="polite"></p>
            <button type="submit">Sign in</button>
          </form>
          <p class="page-intro account-prompt">New to Film Finder? <a href="/signup">Create an account</a>.</p>
        </section>
      </main>
    </div>
    <script src="/user-auth.js"></script>
  </body>
</html>
