server.port=${PORT:3000}

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/film_recommendations?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.servlet.multipart.max-request-size=16KB
spring.servlet.multipart.max-file-size=16KB

app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.python-service-url=${PYTHON_SERVICE_URL:http://localhost:8000}
